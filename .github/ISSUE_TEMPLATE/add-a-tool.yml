name: Add a tool
description: Suggest an AI tool to add to the directory
title: "Add: "
labels: ["new-tool"]
body:
  - type: input
    id: name
    attributes:
      label: Tool name
      placeholder: "Abridge"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official URL
      placeholder: "https://www.abridge.com"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Which existing category does this belong in? If none fit, open a "Suggest a category" issue instead.
      options:
        - AI Medical Scribes & Clinical Documentation
        - Medical Imaging & Radiology AI
        - Medical Coding, Billing & Revenue Cycle AI
        - Patient Engagement & Healthcare Chatbots
        - Drug Discovery & Biotech AI
        - Mental Health AI
        - Telehealth & AI Symptom Checking
        - Healthcare Operations & Hospital Workflow AI
        - Other / not sure
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: One-line description
      description: Factual, ≤160 characters, no superlatives.
      placeholder: "Ambient AI scribe that generates clinical notes from patient-clinician conversations."
    validations:
      required: true
  - type: dropdown
    id: pricing
    attributes:
      label: Pricing tier
      options:
        - Free
        - Freemium
        - Paid
        - Paid (enterprise/custom pricing)
    validations:
      required: true
  - type: checkboxes
    id: disclosure
    attributes:
      label: Disclosure
      options:
        - label: I'm not affiliated with this tool, or I've said so above/below
